<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teaching Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <section id="lock-screen" class="lock">
    <form id="lock-form" class="lock-box" autocomplete="off">
      <h1>Teaching Resources</h1>
      <p>Enter the password to continue.</p>
      <input id="password" type="password" placeholder="Password" required autofocus />
      <button type="submit" class="btn primary">Unlock</button>
      <p id="lock-error" class="error" role="alert" hidden>Wrong password. Try again.</p>
    </form>
  </section>

  <!-- MAIN SITE (hidden until unlocked) -->
  <main id="app" hidden>
    <header class="topbar">
      <h1>Teaching Resources</h1>
      <button id="logout" class="btn ghost">Lock</button>
    </header>

    <!-- Screen 1: subjects -->
    <section id="subjects-screen">
      <p class="lead">Choose a subject</p>
      <div id="subject-list" class="grid subjects"></div>
      <section id="syllabus-section">
        <h2>Syllabuses</h2>
        <div id="syllabus-list" class="grid papers"></div>
      </section>
    </section>

    <!-- Screen 2: question / answer cards -->
    <section id="papers-screen" hidden>
      <button id="back" class="btn ghost">&larr; All subjects</button>
      <h2 id="subject-title"></h2>
      <p id="subject-code" class="lead"></p>
      <div id="paper-list" class="grid papers"></div>
      <div id="rubric-wrap" hidden>
        <h3>Activity rubrics</h3>
        <div id="rubric-list" class="grid papers"></div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
